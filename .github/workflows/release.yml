name: Release
on:
  push:
    branches: [main]
    paths: ["custom_components/**"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: v
        run: echo "version=$(jq -r .version custom_components/hybrid_heating/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in manifest.json to publish an update."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
