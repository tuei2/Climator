# Climator dashboard
# Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch"
# -> open it -> pencil -> three dots -> "Raw configuration editor" -> paste this file.
title: Climator
views:
  - title: Status
    path: status
    icon: mdi:thermostat
    cards:
      - type: thermostat
        entity: climate.climator
      - type: entities
        title: Now
        entities:
          - select.climator_mode
          - sensor.climator_strategy
          - sensor.climator_phase
          - sensor.climator_reason
          - sensor.climator_preheat_start
      - type: entities
        title: Schedule
        entities:
          - number.climator_comfort_temp
          - number.climator_eco_temp
          - time.climator_comfort_start
          - time.climator_comfort_end
      - type: entities
        title: Energy prices
        entities:
          - number.climator_price_kwh
          - number.climator_price_gas
      - type: glance
        title: Heating cost today
        entities:
          - sensor.climator_cost_today_airco
          - sensor.climator_cost_today_cv
          - sensor.climator_cost_today_total
      - type: history-graph
        title: Last 24 hours
        hours_to_show: 24
        entities:
          - entity: climate.climator
          - entity: sensor.climator_strategy

  - title: Costs
    path: costs
    icon: mdi:currency-eur
    cards:
      - type: statistics-graph
        title: Heating cost per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types: [change]
        entities:
          - sensor.climator_cost_airco
          - sensor.climator_cost_cv
      - type: statistics-graph
        title: Heating cost per month
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types: [change]
        entities:
          - sensor.climator_cost_airco
          - sensor.climator_cost_cv
      - type: history-graph
        title: Cost to keep warm (per hour)
        hours_to_show: 168
        entities:
          - sensor.climator_maintain_cost_airco
          - sensor.climator_maintain_cost_cv

  - title: Learning
    path: learning
    icon: mdi:school
    cards:
      - type: glance
        title: Heat-up rate at current outdoor temperature
        entities:
          - sensor.climator_heat_rate_airco
          - sensor.climator_heat_rate_cv
          - sensor.climator_heat_rate_both
      - type: glance
        title: Cost to heat up 1 °C
        entities:
          - sensor.climator_heat_cost_airco
          - sensor.climator_heat_cost_cv
          - sensor.climator_heat_cost_both
      - type: statistics-graph
        title: Learned heat-up rate over time
        chart_type: line
        period: day
        days_to_show: 60
        stat_types: [mean]
        entities:
          - sensor.climator_heat_rate_airco
          - sensor.climator_heat_rate_cv
          - sensor.climator_heat_rate_both
      - type: markdown
        title: Learned data per outdoor temperature
        content: >-
          {% set t = state_attr('sensor.climator_learning', 'table') or [] %}
          {% if t | count == 0 %}Nothing learned yet. Samples so far: {{ states('sensor.climator_learning') }}{% else %}
          | Source | Outdoor | Heat-up | € per °C | € per h per K | Samples (heat/keep) |
          |---|---|---|---|---|---|
          {% for r in t %}| {{ r.strategy }} | {{ r.outdoor }} °C | {{ r.rate }} °C/h | {{ r.cost_per_deg }} | {{ r.maintain_cost_per_hour_per_k }} | {{ r.heat_samples }} / {{ r.maintain_samples }} |
          {% endfor %}
          Last event: {{ state_attr('sensor.climator_learning', 'last_event') or '-' }}
          {% endif %}
