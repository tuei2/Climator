# Climator dashboard
# Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch"
# -> open it -> pencil -> three dots -> "Raw configuration editor" -> paste this file.
title: Climator
views:
  - title: Status
    path: status
    icon: mdi:thermostat
    cards:
      - type: thermostat
        entity: climate.climator
      - type: entities
        title: Now
        entities:
          - select.climator_mode
          - sensor.climator_strategy
          - sensor.climator_phase
          - sensor.climator_reason
          - sensor.climator_preheat_start
      - type: entities
        title: Temperatures & presence
        entities:
          - number.climator_eco_temp
          - number.climator_away_temp
          - number.climator_vacation_temp
          - switch.climator_vacation
          - switch.climator_guest
          - sensor.climator_presence
          - sensor.climator_comfort_score
          - sensor.climator_expected_cost_24h
          - sensor.climator_expected_cost_week
          - sensor.climator_next_action
      - type: entities
        title: Energy prices
        entities:
          - number.climator_price_kwh
          - number.climator_price_gas
      - type: glance
        title: Heating cost today
        entities:
          - sensor.climator_cost_today_airco
          - sensor.climator_cost_today_cv
          - sensor.climator_cost_today_total
      - type: history-graph
        title: Last 24 hours
        hours_to_show: 24
        entities:
          - entity: climate.climator
          - entity: sensor.climator_strategy

  - title: Costs
    path: costs
    icon: mdi:currency-eur
    cards:
      - type: statistics-graph
        title: Heating cost per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types: [change]
        entities:
          - sensor.climator_cost_airco
          - sensor.climator_cost_cv
      - type: statistics-graph
        title: Heating cost per month
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types: [change]
        entities:
          - sensor.climator_cost_airco
          - sensor.climator_cost_cv
      - type: history-graph
        title: Cost to keep warm (per hour)
        hours_to_show: 168
        entities:
          - sensor.climator_maintain_cost_airco
          - sensor.climator_maintain_cost_cv

  - title: Model
    path: model
    icon: mdi:chart-bell-curve
    cards:
      - type: glance
        title: Model health
        entities:
          - sensor.climator_model_accuracy
          - sensor.climator_diagnostics
          - sensor.climator_learning
      - type: glance
        title: Heat-up rate right now
        entities:
          - sensor.climator_heat_rate_airco
          - sensor.climator_heat_rate_cv
          - sensor.climator_heat_rate_both
      - type: glance
        title: Cost to heat up 1 °C
        entities:
          - sensor.climator_heat_cost_airco
          - sensor.climator_heat_cost_cv
          - sensor.climator_heat_cost_both
      - type: markdown
        title: Learned parameters
        content: >-
          {% set p = state_attr('sensor.climator_learning', 'parameters') or {} %}
          {% set c = state_attr('sensor.climator_learning', 'confidence') or {} %}
          | Parameter | Value | Confidence |
          |---|---|---|
          | Heat loss (1/h) | {{ p.k }} | {{ c.k }} |
          | Air conditioner gain (°C/h per kW) | {{ p.ga0 }} + {{ p.ga1 }} × T_out | {{ c.ga0 }} |
          | Boiler gain (°C/h per m³/h) | {{ p.gc }} | {{ c.gc }} |
          | Solar gain (°C/h per kW) | {{ p.gs }} | {{ c.gs }} |

          The Climator sidebar panel (tab *Model*) explains these values in plain language.
      - type: entities
        title: Functions
        entities:
          - switch.climator_feature_fan
          - switch.climator_feature_windows
          - switch.climator_feature_presence
          - switch.climator_feature_forecast
          - switch.climator_feature_buffer
          - switch.climator_feature_solar
          - switch.climator_feature_notifications
          - switch.climator_feature_suggestions
