reset_learning:
  fields:
    scope:
      default: model
      selector:
        select:
          translation_key: reset_scope
          options:
            - all
            - model
            - costs
            - comfort
            - suggestions
            - weather
train_from_history:
  fields:
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: d
